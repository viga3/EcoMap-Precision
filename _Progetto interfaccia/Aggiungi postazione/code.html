<!DOCTYPE html>

<html lang="it"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>EcoMap Precision - Bin Entry</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary": "#ffffff",
                    "background": "#f9f9ff",
                    "primary-container": "#00873a",
                    "tertiary-fixed": "#ffdf9a",
                    "inverse-primary": "#62df7d",
                    "on-tertiary-fixed": "#251a00",
                    "on-secondary-fixed-variant": "#004395",
                    "outline": "#6e7b6c",
                    "secondary-fixed-dim": "#adc6ff",
                    "on-primary": "#ffffff",
                    "error-container": "#ffdad6",
                    "surface-variant": "#dce2f3",
                    "on-surface-variant": "#3e4a3d",
                    "secondary-fixed": "#d8e2ff",
                    "tertiary-container": "#936f00",
                    "on-secondary-container": "#fefcff",
                    "on-primary-fixed": "#002109",
                    "primary-fixed": "#7ffc97",
                    "secondary-container": "#2170e4",
                    "on-tertiary-fixed-variant": "#5a4300",
                    "surface-container-low": "#f0f3ff",
                    "primary": "#006b2c",
                    "on-error": "#ffffff",
                    "tertiary": "#755800",
                    "on-surface": "#151c27",
                    "on-secondary-fixed": "#001a42",
                    "inverse-surface": "#2a313d",
                    "surface-container": "#e7eefe",
                    "on-background": "#151c27",
                    "surface-container-highest": "#dce2f3",
                    "on-tertiary-container": "#fffbff",
                    "on-secondary": "#ffffff",
                    "surface-bright": "#f9f9ff",
                    "surface-tint": "#006e2d",
                    "surface-dim": "#d3daea",
                    "on-error-container": "#93000a",
                    "outline-variant": "#bdcaba",
                    "surface": "#f9f9ff",
                    "on-primary-container": "#f7fff2",
                    "inverse-on-surface": "#ebf1ff",
                    "tertiary-fixed-dim": "#f7be1d",
                    "primary-fixed-dim": "#62df7d",
                    "secondary": "#0058be",
                    "on-primary-fixed-variant": "#005320",
                    "surface-container-high": "#e2e8f8",
                    "surface-container-lowest": "#ffffff",
                    "error": "#ba1a1a"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-mobile": "16px",
                    "base": "4px",
                    "touch-target": "48px",
                    "gutter-mobile": "12px",
                    "stack-md": "16px",
                    "stack-lg": "24px",
                    "stack-sm": "8px"
            },
            "fontFamily": {
                    "headline-sm": ["Inter"],
                    "body-md": ["Inter"],
                    "label-md": ["Inter"],
                    "headline-md": ["Inter"],
                    "label-sm": ["Inter"],
                    "body-lg": ["Inter"],
                    "display-lg": ["Inter"]
            },
            "fontSize": {
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
        .waste-tile { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .waste-tile:active { transform: scale(0.96); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom) + 100px); }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen">
<!-- Top App Bar -->
<header class="w-full top-0 sticky z-40 bg-surface flex items-center justify-between px-margin-mobile h-touch-target">
<div class="flex items-center gap-4">
<button class="transition-colors duration-200 active:scale-95 text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary">Nuova Posizione</h1>
</div>
<div class="h-8 w-8 rounded-full overflow-hidden bg-surface-container-high border border-outline-variant">
<img class="w-full h-full object-cover" data-alt="Profile image" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA_WkQtjBg_TQBrbEoguls8Gohhl2SSn6RrPB5x0A5zYf2oaSUpyaJkygkMG3S1gwtZ9_VuwSpAIDXt7Vf0jij7r7yIH5h7hrsw8pCBx5OFbEXcRvBlZyt7thp9-0QX0W0HyywClFdUzPYenSmZrwo2Mf-cD66f-Y_1ndtd1vM9dmj7mEvv_xn2FaDmERK_eb9256OAYuqev2wHrJe6GeVVpXYviyhzOqqaxZc1w-Xq1GjwUG7Bnek"/>
</div>
</header>
<main class="px-margin-mobile pt-stack-sm safe-bottom">
<!-- Address Context Card - Made more compact -->
<div class="bg-surface-container-lowest border border-outline-variant p-3 rounded-lg mb-stack-md shadow-sm">
<div class="flex items-start gap-2">
<span class="material-symbols-outlined text-primary text-xl">location_on</span>
<div class="min-w-0">
<p class="font-label-sm text-[10px] text-on-surface-variant uppercase tracking-wider">Indirizzo Rilevato</p>
<h2 class="font-bold text-base text-on-surface truncate">Via Roma, 12, Milano</h2>
<p class="text-[11px] text-outline">GPS: 45.4642° N, 9.1900° E</p>
</div>
</div>
</div>
<!-- Section Title -->
<div class="mb-3">
<h3 class="font-label-md text-xs text-on-surface-variant">SELEZIONA TIPOLOGIA RIFIUTI</h3>
</div>
<!-- Waste Entry Grid - 2 columns, compact tiles -->
<div class="grid grid-cols-2 gap-3">
<!-- Grigio (Indifferenziato) -->
<div class="waste-tile flex flex-col p-3 bg-surface-container-lowest border-l-4 border-l-slate-500 rounded-lg border border-outline-variant shadow-sm h-[120px] justify-between">
<div class="flex items-start justify-between">
<div class="flex flex-col">
<span class="font-bold text-sm text-on-surface">Grigio</span>
<span class="text-[9px] text-outline uppercase font-bold leading-tight">Indifferenziato</span>
</div>
<span class="material-symbols-outlined text-slate-500 text-2xl" style="font-variation-settings: 'FILL' 1;">delete</span>
</div>
<div class="flex items-center justify-center gap-4 bg-slate-50 rounded-md py-1">
<button class="text-slate-700 active:scale-90 transition-transform" onclick="decrement('counter-grigio')"><span class="material-symbols-outlined text-xl">remove</span></button>
<span class="font-bold text-lg text-slate-800 min-w-[16px] text-center" id="counter-grigio">1</span>
<button class="text-slate-700 active:scale-90 transition-transform" onclick="increment('counter-grigio')"><span class="material-symbols-outlined text-xl">add</span></button>
</div>
</div>
<!-- Blu (Carta) -->
<div class="waste-tile flex flex-col p-3 bg-surface-container-lowest border-l-4 border-l-secondary rounded-lg border border-outline-variant shadow-sm h-[120px] justify-between">
<div class="flex items-start justify-between">
<div class="flex flex-col">
<span class="font-bold text-sm text-on-surface">Blu</span>
<span class="text-[9px] text-outline uppercase font-bold leading-tight">Carta</span>
</div>
<span class="material-symbols-outlined text-secondary text-2xl" style="font-variation-settings: 'FILL' 1;">description</span>
</div>
<div class="flex items-center justify-center gap-4 bg-secondary-fixed/30 rounded-md py-1">
<button class="text-secondary active:scale-90 transition-transform" onclick="decrement('counter-blu')"><span class="material-symbols-outlined text-xl">remove</span></button>
<span class="font-bold text-lg text-secondary min-w-[16px] text-center" id="counter-blu">1</span>
<button class="text-secondary active:scale-90 transition-transform" onclick="increment('counter-blu')"><span class="material-symbols-outlined text-xl">add</span></button>
</div>
</div>
<!-- Giallo (Multimateriale) -->
<div class="waste-tile flex flex-col p-3 bg-surface-container-lowest border-l-4 border-l-tertiary rounded-lg border border-outline-variant shadow-sm h-[120px] justify-between">
<div class="flex items-start justify-between">
<div class="flex flex-col">
<span class="font-bold text-sm text-on-surface">Giallo</span>
<span class="text-[9px] text-outline uppercase font-bold leading-tight">Giallo</span>
</div>
<span class="material-symbols-outlined text-tertiary text-2xl" style="font-variation-settings: 'FILL' 1;">recycling</span>
</div>
<div class="flex items-center justify-center gap-4 bg-tertiary-fixed/30 rounded-md py-1">
<button class="text-tertiary active:scale-90 transition-transform" onclick="decrement('counter-giallo')"><span class="material-symbols-outlined text-xl">remove</span></button>
<span class="font-bold text-lg text-tertiary min-w-[16px] text-center" id="counter-giallo">1</span>
<button class="text-tertiary active:scale-90 transition-transform" onclick="increment('counter-giallo')"><span class="material-symbols-outlined text-xl">add</span></button>
</div>
</div>
<!-- Verde (Vetro) -->
<div class="waste-tile flex flex-col p-3 bg-surface-container-lowest border-l-4 border-l-primary rounded-lg border border-outline-variant shadow-sm h-[120px] justify-between">
<div class="flex items-start justify-between">
<div class="flex flex-col">
<span class="font-bold text-sm text-on-surface">Verde</span>
<span class="text-[9px] text-outline uppercase font-bold leading-tight">Vetro</span>
</div>
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">bottom_drawer</span>
</div>
<div class="flex items-center justify-center gap-4 bg-primary-fixed/30 rounded-md py-1">
<button class="text-primary active:scale-90 transition-transform" onclick="decrement('counter-verde')"><span class="material-symbols-outlined text-xl">remove</span></button>
<span class="font-bold text-lg text-primary min-w-[16px] text-center" id="counter-verde">1</span>
<button class="text-primary active:scale-90 transition-transform" onclick="increment('counter-verde')"><span class="material-symbols-outlined text-xl">add</span></button>
</div>
</div>
<!-- Marrone (Organico) - Same layout as others -->
<div class="waste-tile flex flex-col p-3 bg-surface-container-lowest border-l-4 border-l-amber-800 rounded-lg border border-outline-variant shadow-sm h-[120px] justify-between">
<div class="flex items-start justify-between">
<div class="flex flex-col">
<span class="font-bold text-sm text-on-surface">Marrone</span>
<span class="text-[9px] text-outline uppercase font-bold leading-tight">Organico</span>
</div>
<span class="material-symbols-outlined text-amber-800 text-2xl" style="font-variation-settings: 'FILL' 1;">compost</span>
</div>
<div class="flex items-center justify-center gap-4 bg-amber-100 rounded-md py-1">
<button class="text-amber-800 active:scale-90 transition-transform" onclick="decrement('counter-marrone')"><span class="material-symbols-outlined text-xl">remove</span></button>
<span class="font-bold text-lg text-amber-800 min-w-[16px] text-center" id="counter-marrone">1</span>
<button class="text-amber-800 active:scale-90 transition-transform" onclick="increment('counter-marrone')"><span class="material-symbols-outlined text-xl">add</span></button>
</div>
</div>
</div>
</main>
<!-- Bottom Actions Container -->
<div class="fixed bottom-0 left-0 w-full bg-surface p-4 flex flex-col gap-2 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-50">
<div class="flex gap-4">
<button class="flex-1 h-touch-target border border-outline text-on-surface font-label-md rounded-lg active:bg-surface-variant/20 transition-colors">
                Annulla
            </button>
<button class="flex-[2] h-touch-target bg-primary-container text-white font-label-md rounded-lg active:scale-95 transition-transform shadow-md flex items-center justify-center gap-2" onclick="handleSave()">
<span class="material-symbols-outlined">save</span>
                OK / Salva
            </button>
</div>
</div>
<!-- Notification Toast -->
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-6 py-3 rounded-full font-label-md shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50" id="toast">
        Posizione salvata con successo
    </div>
<script>
        function increment(id) {
            const el = document.getElementById(id);
            let val = parseInt(el.innerText);
            el.innerText = val + 1;
            
            el.classList.add('scale-110');
            setTimeout(() => el.classList.remove('scale-110'), 150);
        }

        function decrement(id) {
            const el = document.getElementById(id);
            let val = parseInt(el.innerText);
            if (val > 0) {
                el.innerText = val - 1;
                el.classList.add('scale-90');
                setTimeout(() => el.classList.remove('scale-90'), 150);
            }
        }

        function handleSave() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            
            setTimeout(() => {
                toast.classList.add('opacity-0');
                toast.classList.remove('opacity-100');
            }, 3000);
        }
    </script>
</body></html>
