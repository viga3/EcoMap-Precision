<!DOCTYPE html>

<html class="light" lang="it"><head>

<style>

                        "on-tertiary-fixed": "#251a00",
                        "surface-dim": "#d3daea",
                        "primary-fixed": "#7ffc97",
                        "on-tertiary": "#ffffff",
                        "surface": "#f9f9ff",
                        "outline-variant": "#bdcaba",
                        "on-tertiary-fixed-variant": "#5a4300",
                        "on-surface": "#151c27",
                        "secondary-container": "#2170e4",
                        "on-tertiary-container": "#fffbff",
                        "background": "#f9f9ff",
                        "outline": "#6e7b6c",
                        "tertiary-fixed-dim": "#f7be1d",

<style>
    body {
      min-height: max(884px, 100dvh);
    }

</head>
<body class="bg-background text-on-surface">
<!-- Top Navigation Anchor -->
<header class="w-full top-0 sticky z-40 bg-surface flex items-center justify-between px-margin-mobile h-touch-target">
<div class="flex items-center gap-2">
<button class="p-2 -ml-2 transition-colors duration-200 active:scale-95 hover:bg-surface-variant rounded-full">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary">EcoMap Precision</h1>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center border border-outline-variant overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A clean, professional headshot of a user against a neutral background, styled in a modern corporate aesthetic with soft lighting and professional attire." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDwci_KAT-5yLGYWU1pdvD4Ip3n3mGgPdHcoPlkWL6_6n6M1SNkdBE8HICHMit84TfP6vwEdFLfxMzXOslXuS7CwwiyhnnVJh4OVTOt9VptahqR9pRTSl3sltNUMdPa0k8J_btF4MrdBUr0lD7RXu5xiqibixoBY2q4r4BbzSOVUTnuBqyAslh4JREa4684p3RK2vzzFemGTY11kX4ogEgjwW14AjQgwt1GM3EITj1jOh-NBo74ufk"/>
</div>
</header>
<main class="px-margin-mobile pt-stack-md safe-area-bottom">
<!-- Header Section: Location -->
<section class="mb-stack-lg">
<div class="flex flex-col gap-1">
<span class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-wider">La tua posizione</span>
<div class="flex items-center gap-3 bg-surface-container p-4 rounded-xl border border-outline-variant"><div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container"><span class="material-symbols-outlined">location_on</span></div><div class="flex-1"><div><span class="text-label-sm font-label-sm text-primary uppercase tracking-wider">Postazione Rilevata</span><h2 class="font-headline-sm text-headline-sm text-on-surface">Via del Corso, 412</h2></div><p class="text-label-sm font-label-sm text-on-surface-variant">Distanza: 8m • Precisione GPS: 3m</p></div><div class="flex items-center gap-1 text-primary"><span class="material-symbols-outlined text-body-md">check_circle</span><span class="text-label-sm">Auto</span></div></div>
</div>
</section><section class="mb-stack-lg"><div class="bg-surface-container-low border border-outline-variant rounded-xl p-4 flex flex-col gap-3"><div class="flex items-center justify-between"><div class="flex items-center gap-2"><span class="material-symbols-outlined text-on-surface-variant">home</span><span class="text-label-md font-label-md text-on-surface">Segnala da casa?</span></div><button class="text-primary text-label-md font-label-md hover:underline">Attiva Manuale</button></div><div class="grid grid-cols-2 gap-2"><button class="flex items-center justify-center gap-2 p-2 bg-surface border border-outline-variant rounded-lg text-label-sm font-label-sm hover:border-primary transition-colors"><span class="material-symbols-outlined text-body-md">map</span>Scegli da mappa</button><button class="flex items-center justify-center gap-2 p-2 bg-surface border border-outline-variant rounded-lg text-label-sm font-label-sm hover:border-primary transition-colors"><span class="material-symbols-outlined text-body-md">search</span>Cerca indirizzo</button></div></div></section>
<!-- Reporting Grid -->
<section class="mb-stack-lg">
<h3 class="text-label-md font-label-md text-on-surface-variant mb-stack-sm">Cosa vuoi segnalare?</h3>
<div class="grid grid-cols-2 gap-gutter-mobile">
<!-- Option 1 -->
<button class="report-option flex flex-col items-center justify-center p-4 bg-surface border border-outline-variant rounded-xl gap-2 transition-all duration-150 active:scale-95 hover:border-primary" onclick="toggleActive(this)">
<div class="icon-container w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary transition-colors">
<span class="material-symbols-outlined">delete_sweep</span>
</div>
<span class="text-label-md font-label-md text-center">Abbandoni</span>
</button>
<!-- Option 2 -->
<button class="report-option flex flex-col items-center justify-center p-4 bg-surface border border-outline-variant rounded-xl gap-2 transition-all duration-150 active:scale-95 hover:border-primary" onclick="toggleActive(this)">
<div class="icon-container w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary transition-colors">
<span class="material-symbols-outlined">chair</span>
</div>
<span class="text-label-md font-label-md text-center">Ingombranti</span>
</button>
<!-- Option 3 -->
<button class="report-option flex flex-col items-center justify-center p-4 bg-surface border border-outline-variant rounded-xl gap-2 transition-all duration-150 active:scale-95 hover:border-primary" onclick="toggleActive(this)">
<div class="icon-container w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary transition-colors">
<span class="material-symbols-outlined">propane_tank</span>
</div>
<span class="text-label-md font-label-md text-center">Bombole</span>
</button>
<!-- Option 4 -->
<button class="report-option flex flex-col items-center justify-center p-4 bg-surface border border-outline-variant rounded-xl gap-2 transition-all duration-150 active:scale-95 hover:border-primary" onclick="toggleActive(this)">
<div class="icon-container w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary transition-colors">
<span class="material-symbols-outlined">shopping_bag</span>
</div>
<span class="text-label-md font-label-md text-center">Sacchi a terra</span>
</button>
<!-- Option 5 (Col-span 2 for balance) -->
<button class="report-option flex flex-col items-center justify-center p-4 bg-surface border border-outline-variant rounded-xl gap-2 transition-all duration-150 active:scale-95 hover:border-primary" onclick="toggleActive(this)"><div class="icon-container w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary transition-colors"><span class="material-symbols-outlined">lock_reset</span></div><span class="text-label-md font-label-md text-center">Cassonetto bloccato o danneggiato</span></button>
<button class="report-option flex flex-col items-center justify-center p-4 bg-surface border border-outline-variant rounded-xl gap-2 transition-all duration-150 active:scale-95 hover:border-primary" onclick="toggleActive(this)"><div class="icon-container w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary transition-colors"><span class="material-symbols-outlined">warning</span></div><span class="text-label-md font-label-md text-center">Rifiuti Speciali</span></button></div>
</section>
<!-- Photo Section -->
<section class="mb-stack-lg">
<h3 class="text-label-md font-label-md text-on-surface-variant mb-stack-sm">Documentazione fotografica</h3>
<div class="flex flex-col gap-3">
<button class="w-full h-32 border-2 border-dashed border-outline-variant rounded-xl bg-surface-container-low flex flex-col items-center justify-center gap-2 hover:border-primary hover:bg-surface-container transition-all active:scale-[0.98]">
<span class="material-symbols-outlined text-primary text-4xl">add_a_photo</span>
<span class="text-label-md font-label-md text-on-surface">Scatta o allega foto</span>
<span class="text-label-sm font-label-sm text-on-surface-variant">(Consigliato per velocizzare l'intervento)</span>
</button>
<!-- Thumbnail Placeholder (hidden until added) -->
<div class="hidden flex gap-2 overflow-x-auto pb-2" id="photo-preview">
<!-- Dynamic preview would go here -->
</div>
</div>
</section>
<!-- Notes Section -->
<section class="mb-stack-lg">
<h3 class="text-label-md font-label-md text-on-surface-variant mb-stack-sm">Note aggiuntive</h3>
<textarea class="w-full p-4 bg-surface border border-outline-variant rounded-xl focus:border-primary focus:ring-2 focus:ring-primary/20 text-body-md font-body-md min-h-[120px] outline-none transition-all" placeholder="Aggiungi dettagli come il civico esatto o il tipo di rifiuto..."></textarea>
</section>
</main>
<!-- Fixed Action Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-highest/95 backdrop-blur-sm p-margin-mobile flex flex-col gap-4 z-50">
<button class="w-full h-touch-target bg-primary-container text-on-primary-container font-headline-sm text-headline-sm rounded-full flex items-center justify-center gap-2 shadow-sm active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined">send</span>
            Invia Segnalazione
        </button>
</div>
<!-- Background Mapping Context Decorator -->
<div class="fixed -z-10 top-0 left-0 w-full h-screen opacity-20 pointer-events-none">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A detailed digital mapping interface showing a high-contrast GPS view of an urban environment with clean streets, waste disposal icons, and environmental sustainability symbols. The aesthetic is modern corporate with a focus on functional utility and ecological responsibility." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBquGBuwbdnLcj_b4kLo9UpCXHyLQ4cxSlpFDZQ3pIxH277GkWBq0juH6WEJxQb13QuY_f3asq58qgX24sojAfZzuDzU6WacLkzB5aUL0yOKkiXXgFN6pEehJF2plAQmTUWOuV6EBY-ZINcA_vjiAOKKHFEBFNBdCFLmUdQM0ZoCyhlcr5GIy3OD1i0v-5yElYgfeeNi0vCWDlIK_kx-9prRcB6-_--yH36ViTCciOWVeM6gt5kYEo')"></div>
<div class="absolute inset-0 bg-gradient-to-b from-background via-transparent to-background"></div>
</div>
<script>
        function toggleActive(element) {
            // In a real app, we might want multiple selection or single. 
            // For this UI, let's allow single selection for clarity.
            const allOptions = document.querySelectorAll('.report-option');
            allOptions.forEach(opt => opt.classList.remove('active'));
            element.classList.add('active');
            
            // Success Haptic Feedback simulation
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        }

        // Simple animation on load
        document.addEventListener('DOMContentLoaded', () => {
            const sections = document.querySelectorAll('main > section');
            sections.forEach((section, index) => {
                section.style.opacity = '0';
                section.style.transform = 'translateY(10px)';
                setTimeout(() => {
                    section.style.transition = 'all 0.4s ease-out';
                    section.style.opacity = '1';
                    section.style.transform = 'translateY(0)';
                }, 100 * index);
            });
        });
    </script>
</body></html>
