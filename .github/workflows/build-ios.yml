name: Build iOS IPA (EcoMap Precision)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Application (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Compile and Package IPA
        run: |
          if [ -d "EcoMapPrecision.xcodeproj" ]; then
            PROJECT_DIR="."
          elif [ -d "EcoMapPrecision-iOS/EcoMapPrecision.xcodeproj" ]; then
            PROJECT_DIR="EcoMapPrecision-iOS"
          else
            echo "Error: EcoMapPrecision.xcodeproj not found!"
            exit 1
          fi

          echo "Using project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          echo "Compiling iOS App with xcodebuild..."
          xcodebuild clean build \
            -project EcoMapPrecision.xcodeproj \
            -scheme EcoMapPrecision \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

          echo "Packaging into IPA for Sideloadly..."
          mkdir -p Payload
          cp -r build/Release-iphoneos/EcoMapPrecision.app Payload/
          zip -r EcoMapPrecision.ipa Payload/
          rm -rf Payload

          echo "Build successful! Created EcoMapPrecision.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoMapPrecision-iOS-IPA
          path: "**/EcoMapPrecision.ipa"
          retention-days: 14
